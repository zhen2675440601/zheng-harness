<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zheng Harness 聊天工作台</title>
  <link rel="stylesheet" href="/web/css/app.css">
</head>
<body>
  <div id="auth-screen" data-test="auth-panel">
    <div class="card auth-card">
      <div class="auth-copy">
        <span class="eyebrow">Embedded Chat Workspace</span>
        <h1>连接 Harness 智能体</h1>
        <p>输入 JWT 后直接进入对话工作台，在同一界面完成提问、流式观察、历史切换与执行复盘。</p>
      </div>
      <div id="auth-auto-connecting" style="display:none">
        <p>正在自动连接...</p>
      </div>
      <div id="auth-manual" style="display:block">
        <input type="password" id="jwt-input" aria-label="JWT 令牌" placeholder="请输入或粘贴 JWT 令牌">
        <button id="connect-btn">进入聊天工作台</button>
      </div>
      <div id="auth-status-connected" data-test="auth-status-connected" style="display:none">
        <span class="status-dot green"></span> 已连接
      </div>
      <div id="auth-error" data-test="auth-error" style="display:none"></div>
    </div>
  </div>

  <div id="main-content" class="app-shell" style="display:none">
    <aside id="history-panel" class="sidebar-shell workspace-panel history-panel">
      <div class="sidebar-head">
        <button id="new-chat-btn" class="sidebar-primary-button" type="button">＋ 新对话</button>
      </div>

      <div id="history-error" class="inline-banner inline-banner-danger" style="display:none"></div>
      <div id="conversation-list" data-test="conversation-list" class="history-list"></div>
    </aside>

    <main id="page-chat" data-test="page-chat" class="chat-shell">
      <header class="chat-topbar" data-test="nav">
        <div class="chat-topbar-left">
          <button id="history-toggle" class="ghost-button icon-button" type="button" aria-label="切换侧栏">☰</button>
          <div class="chat-title-block">
            <h2 id="conversation-title">新对话</h2>
            <p id="conversation-subtitle" class="page-subtitle">发送第一条消息以创建会话。</p>
          </div>
        </div>
        <div class="chat-topbar-actions">
          <button id="inspect-toggle" class="ghost-button" type="button">设置 / Inspect</button>
        </div>
      </header>

      <section class="chat-stage card">
        <div class="chat-status-row">
          <div class="status-summary">
            <span id="connection-indicator" class="status-dot green"></span>
            <span id="connection-label">已连接</span>
            <span class="status-separator">·</span>
            <span id="stream-status-text">空闲</span>
          </div>
          <div class="chat-inline-actions">
            <span id="conversation-status" class="status-badge status-created">ready</span>
            <code id="conversation-id" class="conversation-chip">未创建</code>
            <button id="resume-btn" class="ghost-button compact-button" type="button" style="display:none">继续执行</button>
          </div>
        </div>

        <div id="stream-disconnected" data-test="stream-disconnected" class="inline-banner inline-banner-danger" style="display:none"></div>
        <div id="composer-error" class="inline-banner inline-banner-danger" style="display:none"></div>

        <div id="conversation-stream" data-test="conversation-stream" class="chat-transcript"></div>

        <form id="composer-form" data-test="composer-form" class="composer-shell">
          <div class="composer-frame">
            <textarea id="composer-input" aria-label="消息内容" rows="4" placeholder="给 Zheng Harness 发送消息…"></textarea>
            <div id="composer-validation-error" data-test="composer-validation-error" style="display:none"></div>
            <div class="composer-footer">
              <div class="composer-meta">
                <label class="sr-only" for="composer-task-type">任务类型</label>
                <select id="composer-task-type" aria-label="任务类型">
                  <option value="coding">编码执行</option>
                  <option value="research">研究分析</option>
                  <option value="file_workflow">文件流处理</option>
                  <option value="general">通用任务</option>
                </select>
                <p class="composer-hint">首条消息会创建新会话，后续消息会追加到当前对话。</p>
              </div>
              <button type="submit" id="send-message-btn" class="send-button">发送</button>
            </div>
          </div>
        </form>
      </section>
    </main>

    <aside id="inspect-panel" class="inspect-panel" style="display:none">
      <div class="inspect-card card workspace-panel">
        <div class="panel-heading">
          <div>
            <span class="eyebrow">Inspect</span>
            <h3>执行细节</h3>
          </div>
          <div class="chat-inline-actions">
            <button id="disconnect-btn" class="ghost-button compact-button" type="button">断开</button>
            <button id="inspect-close" class="ghost-button compact-button" type="button">关闭</button>
          </div>
        </div>
        <p class="page-subtitle">查看当前任务计划、工具调用、步骤状态与验证线索。</p>
        <div id="inspect-detail" data-test="inspect-detail"></div>
      </div>
    </aside>
  </div>

  <script src="/web/js/auth.js"></script>
  <script src="/web/js/api.js"></script>
  <script src="/web/js/app.js"></script>
</body>
</html>
